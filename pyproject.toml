[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry-airgap"
version = "0.1.0"
description = "Signed, reviewable AI model transfer bundles and a policy-enforcing local inference gateway for disconnected networks."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are deliberately few: every one of them has to be carried
# into a disconnected network and reviewed. See docs/network-dependencies.md.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ferry = "ferry.cli:main"

[tool.setuptools.packages.find]
include = ["ferry*"]

[tool.setuptools.package-data]
ferry = ["static/*", "static/**/*", "preflight_hook/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llamacpp: needs a real llama-server binary and GGUF model (set FERRY_TEST_LLAMACPP_MODEL)",
]
