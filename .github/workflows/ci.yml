# Continuous integration. Not yet run: this repository has not been pushed to GitHub.
# The Linux job is the first real test of the network-namespace isolation path
# (ferry/sandbox.py), which has only been written and reviewed, never executed.
name: ci

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # Pinned: the isolation checks depend on the OS release, and GitHub is
        # migrating ubuntu-latest to Ubuntu 26.
        os: [ubuntu-24.04, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Linux isolation prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor by default.
          # This runner is disposable, so allow them for the test; production hosts use the
          # documented alternatives (docs/deployment.md).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python -c "from ferry.sandbox import detect_isolation as d; i = d(); print(i.mechanism, '-', i.description)"
      - name: Test
        run: python -m pytest -q
      - name: Isolation must be available on Linux
        if: runner.os == 'Linux'
        run: python -c "from ferry.sandbox import detect_isolation as d; import sys; sys.exit(0 if d().available else 1)"
      - name: Egress is blocked inside the sandbox
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_sandbox.py -k "actually_blocks_egress"

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Built console references no external URL
        run: "! grep -rE 'https?://' ../ferry/static"
